name: SiddysSimplePlugin
version: 5.0.0
main: org.siddharth.ssmp.SiddysSimplePlugin
description: Siddys Simple Plugin 5.0.0 | Improved, Better and Fixed | Thanks a ton for using, you're the BEST.
author: Siddy
api-version: '1.21.11'
website: https://github.com/SiddharthC0/siddys-simple-plugin
prefix: SiddysSimplePlugin
bootstrapper: org.siddharth.ssmp.mechanics.Bootstrap

commands:

  ssmp:
    description: Main SSMP management command.
    usage: /SiddysSimplePlugin <permission|reload|help>
    aliases:
      - siddysimpleplugin
      - siddysimpleplugin
      - menu

  rtp:
    description: Opens the SSMP Random Teleport GUI.
    usage: /rtp
    aliases:
      - randomtp
      - wild
      - wildtp
      - randomteleport

  rank:
    description: Manages SSMP ranks.
    usage: /rank <list|create|delete|give|remove|setprefix|setsuffix|setname|info>
    aliases:
      - ranks

  economy:
    description: Manages the SSMP economy.
    usage: /economy <balance|pay|give|take|set>
    aliases:
      - eco

  shop:
    description: Opens the SSMP shop.
    usage: /shop
    aliases:
      - store

  ah:
    description: Opens the SSMP Auction House.
    usage: /ah [sell <price>|remove <id>]
    aliases:
      - auctionhouse
      - auction

  enderchest:
    description: Opens your Ender Chest.
    usage: /enderchest
    aliases:
      - ec
      - echest

  sethome:
    description: Sets a home at your current location.
    usage: /sethome <name>

  home:
    description: Teleports to a home or opens the homes GUI.
    usage: /home [name]

  homes:
    description: Opens the homes GUI.
    usage: /homes

  delhome:
    description: Deletes a home.
    usage: /delhome <name>

  setwarp:
    description: Sets a server warp at your current location.
    usage: /setwarp <name>

  warp:
    description: Teleports to a server warp or opens the warps GUI.
    usage: /warp [name]
    aliases:
      - w

  warps:
    description: Opens the warps GUI.
    usage: /warps

  delwarp:
    description: Deletes a server warp.
    usage: /delwarp <name>

  nick:
    description: Changes your nickname.
    usage: /nick <nickname|off|color>
    aliases:
      - nickname
      - nicky

  kit:
    description: Opens and manages SSMP kits.
    usage: /kit [name|create|delete|edit|give|list|reload]
    aliases:
      - kits
      - kitgui
      - kitsgui
      - kitsshop
      - kitshop

  contracts:
    description: Opens the contracts GUI
    usage: /contracts
    permission: SiddysSimplePlugin.contracts.use
    aliases:
      - contractsgui
      - contractgui
      - contract

  bounty:
    description: Opens the bounties GUI
    usage: /bounty
    permission: SiddysSimplePlugin.bounties.use
    aliases:
      - bountygui
      - bounties

  playerinfo:
    description: Opens your player profile
    usage: /playerinfo
    permission: SiddysSimplePlugin.playerinfo.use
    aliases:
      - pinfo
      - info
      - playerinfogui

  mute:
    description: Mute a player
    usage: /mute <player> <duration|permanent> <reason>
    permission: SiddysSimplePlugin.moderation.mute

  unmute:
    description: Remove a player's mute
    usage: /unmute <player>
    permission: SiddysSimplePlugin.moderation.unmute

  warn:
    description: Warn a player
    usage: /warn <player> <reason>
    permission: SiddysSimplePlugin.moderation.warn

  ban:
    description: Ban a player
    usage: /ban <player> <duration|permanent> <reason>
    permission: SiddysSimplePlugin.moderation.ban

  unban:
    description: Remove a player's ban
    usage: /unban <player>
    permission: SiddysSimplePlugin.moderation.unban

  filter:
    description: Manage blocked chat terms
    usage: /filter <add|remove|list|reload>
    permission: SiddysSimplePlugin.moderation.filter

  history:
    description: View moderation history
    usage: /history <player>
    permission: SiddysSimplePlugin.moderation.history

  resetviolations:
    description: Reset a player's chat-filter violation count
    usage: /resetviolations <player>
    permission: SiddysSimplePlugin.moderation.reset

  support:
    description: Opens SSMP support documentation
    usage: /support [name] [subname]
    aliases: [ help ]

  infobar:
    description: Manage your personal InfoBar
    usage: /infobar [on/off/toggle/reload]
    aliases:
      - ibar

  cpanel:
    description: Controls the SSMP Control Panel web server.
    usage: /cpanel [start|stop|status]
    aliases:
      - controlpanel
    permission: SiddysSimplePlugin.cpanel

  configp:
    description: Opens the SSMP module configuration menu.
    aliases: [ spconfig ]
    permission: SiddysSimplePlugin.config

  realname:
    description: Reveals the name of a player having a nickname.
    aliases:
      - revealname
      - namewhat
    permission: SiddysSimplePlugin.revealname

  pshop:
    description: Manage player shops
    usage: /pshop
    aliases: [ playershop, pshops ]
    permission: ssmp.playershop

  tpa:
    description: Teleport to a player through its playername
    usage: /tpa [playername/playernickname]
    aliases:
      - tpplayer
    permission: ssmp.tpa

  tpahere:
    description: Teleport a player to your position through its playername
    usage: /tpahere [playername/playernicknam]
    permission: ssmp.tpa

  tpaccept:
    description: Accept teleportation request
    usage: /tpaccept
    permission: ssmp.tpa

  tpdeny:
    description: Deny teleportation request
    usage: /tpdeny
    permission: ssmp.tpa

  tpcancel:
    description: Cancel teleportation request
    usage: /tpcancel
    permission: ssmp.tpa

permissions:

  ssmp.moderation.admin:
    description: Full moderation access
    default: op
    children:
      ssmp.moderation.mute: true
      ssmp.moderation.unmute: true
      ssmp.moderation.warn: true
      ssmp.moderation.ban: true
      ssmp.moderation.unban: true
      ssmp.moderation.filter: true
      ssmp.moderation.history: true
      ssmp.moderation.reset: true
      ssmp.moderation.notify: true
      ssmp.rtp.use: true
      ssmp.rank.use: true
      ssmp.rank.create: true
      ssmp.rank.delete: true
      ssmp.rank.give: true
      ssmp.rank.remove: true
      ssmp.rank.setprefix: true
      ssmp.rank.setsuffix: true
      ssmp.rank.setname: true

      ssmp.permission.use: true
      ssmp.permission.player: true
      ssmp.permission.rank: true

      ssmp.economy.use: true
      ssmp.economy.balance: true
      ssmp.economy.pay: true
      ssmp.economy.give: true
      ssmp.economy.take: true
      ssmp.economy.set: true

      ssmp.shop.use: true

      ssmp.enderchest.use: true

      ssmp.auction.use: true
      ssmp.auction.sell: true
      ssmp.auction.buy: true
      ssmp.auction.remove: true

      ssmp.orders.use: true
      ssmp.orders.create: true
      ssmp.orders.fulfill: true
      ssmp.orders.cancel: true

      ssmp.kits.use: true
      ssmp.kits.create: true
      ssmp.kits.delete: true
      ssmp.kits.give: true

      ssmp.crates.use: true
      ssmp.crates.create: true
      ssmp.crates.delete: true
      ssmp.crates.give: true

      ssmp.nickname.use: true
      ssmp.nickname.color: true

      ssmp.homes.use: true
      ssmp.homes.sethome: true
      ssmp.homes.delete: true

      ssmp.warps.use: true
      ssmp.warps.set: true
      ssmp.warps.delete: true


  ssmp.moderation.mute:
    default: op
  ssmp.moderation.unmute:
      default: op
  ssmp.moderation.warn:
      default: op

  ssmp.moderation.ban:
      default: op
  ssmp.moderation.unban:
      default: op
  ssmp.moderation.filter:
      default: op
  ssmp.moderation.history:
      default: op
  ssmp.moderation.reset:
      default: op
  ssmp.moderation.notify:
      default: op
  ssmp.moderation.bypass:
      description: Bypass chat moderation
      default: op

  ssmp.revealname:
    description: Allows revealing names from nicknames.
    default: true

  ssmp.rank.use:
    description: Allows the use of SSMP rank commands.
    default: op

  ssmp.config:
    description: Allows access to the SSMP module manager.
    default: op

  ssmp.infobar.reload:
    description: Allows reloading the InfoBar configuration
    default: op

  ssmp.rank.create:
    description: Allows creating ranks.
    default: op

  ssmp.rank.delete:
    description: Allows deleting ranks.
    default: op

  ssmp.rank.give:
    description: Allows assigning ranks to players.
    default: op

  ssmp.rank.remove:
    description: Allows removing ranks from players.
    default: op

  ssmp.rank.setprefix:
    description: Allows changing rank prefixes.
    default: op

  ssmp.cpanel:
    description: Allows access to the SSMP Control Panel server controls.
    default: op

  ssmp.rank.setsuffix:
    description: Allows changing rank suffixes.
    default: op

  ssmp.rank.setname:
    description: Allows changing rank display names.
    default: op

  ssmp.kits.use:
    description: Allows using SSMP kits.
    default: true
  ssmp.kits.create:
    description: Allows creating and editing kits.
    default: op
  ssmp.kits.delete:
    description: Allows deleting kits.
    default: op
  ssmp.kits.give:
    description: Allows giving kits to players.
    default: op
  ssmp.rtp.use:
    description: Allows using SSMP Random Teleport.
    default: true


  ssmp.permission.use:
    description: Allows using SSMP permission management.
    default: op

  ssmp.permission.player:
    description: Allows managing player permissions.
    default: op

  ssmp.permission.rank:
    description: Allows managing rank permissions.
    default: op

  ssmp.economy.use:
    description: Allows use of SSMP economy management commands.
    default: op

  ssmp.economy.balance:
    description: Allows viewing balances.
    default: true

  ssmp.economy.pay:
    description: Allows sending money to players.
    default: true

  ssmp.economy.give:
    description: Allows giving money to players.
    default: op

  ssmp.economy.take:
    description: Allows taking money from players.
    default: op

  ssmp.economy.set:
    description: Allows setting player balances.
    default: op

  ssmp.shop.use:
    description: Allows using the SSMP shop.
    default: true

  ssmp.enderchest.use:
    description: Allows using the SSMP ender chest.
    default: true

  ssmp.auction.use:
    description: Allows using the Auction House.
    default: true

  ssmp.auction.sell:
    description: Allows listing items on the Auction House.
    default: true

  ssmp.auction.buy:
    description: Allows buying items from the Auction House.
    default: true

  ssmp.auction.remove:
    description: Allows removing own Auction House listings.
    default: true

  ssmp.crates.give:
    description: Allows giving crate keys.
    default: op

  ssmp.nickname.use:
    description: Allows using nicknames.
    default: op

  ssmp.nickname.color:
    description: Allows changing nickname colors.
    default: op

  ssmp.homes.use:
    description: Allows using and viewing homes.
    default: true

  ssmp.homes.sethome:
    description: Allows setting homes.
    default: true

  ssmp.homes.delete:
    description: Allows deleting homes.
    default: true

  ssmp.warps.use:
    description: Allows using server warps.
    default: true

  ssmp.warps.set:
    description: Allows setting server warps.
    default: op

  ssmp.warps.delete:
    description: Allows deleting server warps.
    default: op

  ssmp.contracts.use:
    description: Allows using contracts GUI
    default: true
  ssmp.bounties.use:
    description: Allows using bounty GUI
    default: true
  ssmp.playerinfo.use:
    description: Allows using player info GUI
    default: true

  ssmp.playershop:
    description: Allows players to use the player shop system
    default: true

  ssmp.tpa:
    description: Allows players to teleport to each other
    default: true

softdepend:
  - PlaceholderAPI
  - Vault