  ssmp.homes.sethome:
    description: Allows setting homes.
    default: true

  ssmp.homes.delete:
    description: Allows deleting homes.
    default: true

  ssmp.warps.use:
    description: Allows using server warps.
    default: true

  ssmp.warps.set:
    description: Allows setting server warps.
    default: op

  ssmp.warps.delete:
    description: Allows deleting server warps.
    default: op