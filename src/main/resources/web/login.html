<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>DB Login</title>
<link rel="stylesheet" href="/css/main.css">
<script src="/js/api.js" defer></script>
<script src="/js/login.js" defer></script>
</head>
<body class="login-page" style="background-image: url(./css/image/background_login.png); background-size:cover;" id="bodie">
<main class="login-card">
    <div class="eyebrow">SIDDY'S SIMPLE PLUGIN</div>
    <h1>Control Panel</h1>
    <p style="color: var(--muted);">Access your server panel through this page</p>
    <form id="login-form">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <p id="login-error" class="error" role="status"></p>
        <button class="button primary full" type="submit">Unlock panel <span>↗</span></button>
    </form>
    <button class="button primary full">Toggle Theme<span></span></button>
</main>

<aside class="login-clock">
    <div class="clock-time" id="login-clock">00:00</div>
    <div class="clock-date" id="login-date"></div>
</aside>

<script>
    const togState = 1;
const bodyDiv = document.getElementById("bodie")
function toggleTheme() {
    if (togState == 1) {
        bodyDiv.style.backgroundImage = 'url("./css/image/")'
    }
}
</script>
</body>
</html>
