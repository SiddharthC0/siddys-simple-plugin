<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SSMP Control Panel · Login</title>
<link rel="stylesheet" href="/css/main.css">
<script src="/js/api.js" defer></script>
<script src="/js/login.js" defer></script>
</head>
<body class="login-page">
<main class="login-card">
    <div class="brand-mark">S</div>
    <div class="eyebrow">SIDDY'S SIMPLE PLUGIN</div>
    <h1>Control Panel</h1>
    <p class="muted">Sign in to manage your server configuration.</p>
    <form id="login-form">
        <label for="password">Panel password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="button primary full" type="submit">Unlock panel <span>↗</span></button>
        <p id="login-error" class="error" role="status"></p>
    </form>
    <div class="login-foot">If you forgot or don't know your server password, use a remote FTP service to access your server files, or just check the files where your server is hosted to go to SiddysSimplePlugin/cpanel/panel.ssmpManifest.</div>
</main>
</body>
</html>
